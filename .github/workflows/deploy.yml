# Publica o site no GitHub Pages e atualiza o estoque a partir da planilha.
# Roda a cada push, a cada 30 minutos e quando você aperta "Run workflow".
# Para a sincronização funcionar, cadastre em Settings → Secrets → Actions:
#   SHEET_ID                      id da planilha "Painel Morena Pratas"
#   GOOGLE_SERVICE_ACCOUNT_JSON   chave JSON da conta de serviço (com acesso de leitor à planilha)
# Sem esses secrets, o site publica com o último catalog.json do repositório.
name: Publicar site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sincronizar estoque da planilha
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SHEET_ID" ] && [ -n "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then npm run sync; else echo "Sem secrets: usando o catalog.json do repositório"; fi
      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
